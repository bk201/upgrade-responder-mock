apiVersion: v1
kind: Namespace
metadata:
  name: upgrade-mock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upgrade-mock
  namespace: upgrade-mock
  labels:
    app: upgrade-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upgrade-mock
  template:
    metadata:
      labels:
        app: upgrade-mock
    spec:
      containers:
      - name: server
        image: python:3.12-slim
        command: ["python3", "-u", "/config/server.py"]
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: http
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: upgrade-mock
---
apiVersion: v1
kind: Service
metadata:
  name: upgrade-mock
  namespace: upgrade-mock
spec:
  type: NodePort
  selector:
    app: upgrade-mock
  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30880
